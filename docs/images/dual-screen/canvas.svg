<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The 4400 x 1080 Wine canvas and the two Thor screens</title>
  <desc id="d">Wine shows WoW one 4400 by 1080 monitor. Canvas x 0 to 1240 goes to the 1240 by 1080 bottom touchscreen (the home screen). Canvas x 1240 to 3160 goes to the 1920 by 1080 top screen (the game). Canvas x 3160 to 4400 is not shown on either screen. The canvas centre, x 2200, is the centre of the top screen.</desc>
  <!--
    Drawn at 0.2 px per canvas px (canvas row) and 0.15 px per screen px (screen row).
    Numbers: FFSpan 2.5.3 FFSpan_Layout.lua lines 4-7 and 20-45 (game width G = h*16/9 = 1920,
    side strip L = (w - G) / 2 = 1240, HomeRect = x 0..L, GameRect = x L..L+G).
    Marker: FFSpan.lua lines 111-146 (6 px magenta square). Screen sizes: fork patch 10
    (spanBottom=left) and launcher/scripts/set_span_geometry.sh ("home" = 4400x1080).
  -->
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e5e7eb"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9ca3af" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="610" fill="#ffffff"/>

  <text x="40" y="32" font-size="18" font-weight="600" fill="#111827">What WoW sees: one 4400 x 1080 monitor</text>

  <!-- centre line label -->
  <text x="480" y="60" font-size="13" fill="#b91c1c" text-anchor="middle">x 2200: canvas centre = top screen centre</text>

  <!-- canvas regions -->
  <rect x="40" y="70" width="248" height="216" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <rect x="288" y="70" width="384" height="216" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/>
  <rect x="672" y="70" width="248" height="216" fill="url(#hatch)" stroke="#1f2937" stroke-width="2"/>

  <text x="164" y="168" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Home screen</text>
  <text x="164" y="190" font-size="13" fill="#111827" text-anchor="middle">x 0 to 1240</text>

  <text x="480" y="168" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Game view</text>
  <text x="480" y="190" font-size="13" fill="#111827" text-anchor="middle">x 1240 to 3160</text>

  <rect x="708" y="148" width="176" height="50" fill="#ffffff" stroke="#9ca3af"/>
  <text x="796" y="168" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Never shown</text>
  <text x="796" y="189" font-size="13" fill="#111827" text-anchor="middle">x 3160 to 4400</text>

  <line x1="480" y1="66" x2="480" y2="292" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- glue-mode marker, bottom-right corner of the canvas -->
  <rect x="911" y="277" width="7" height="7" fill="#ff00ff" stroke="#111827" stroke-width="0.8"/>

  <!-- ticks -->
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="40" y="304">0</text>
    <text x="288" y="304">1240</text>
    <text x="672" y="304">3160</text>
    <text x="912" y="304">4400</text>
  </g>
  <text x="920" y="324" font-size="12" fill="#374151" text-anchor="end">magenta square: the in-world marker the fork looks for</text>

  <!-- arrows to the physical screens -->
  <line x1="164" y1="312" x2="164" y2="382" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="312" x2="480" y2="382" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- physical screens at 0.15 -->
  <rect x="71" y="390" width="186" height="162" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/>
  <text x="164" y="466" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Bottom touchscreen</text>
  <text x="164" y="486" font-size="13" fill="#111827" text-anchor="middle">1240 x 1080</text>

  <rect x="336" y="390" width="288" height="162" rx="6" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/>
  <text x="480" y="466" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Top screen</text>
  <text x="480" y="486" font-size="13" fill="#111827" text-anchor="middle">1920 x 1080</text>

  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="796" y="420">Not sent to any screen.</text>
    <text x="796" y="440">It is there so the canvas centre</text>
    <text x="796" y="460">(x 2200) lands on the middle</text>
    <text x="796" y="480">of the top screen.</text>
  </g>

  <text x="40" y="585" font-size="13" fill="#374151">Pixels are 1:1. Nothing is scaled. Login, character select and loading screens go to the top screen only.</text>
</svg>
